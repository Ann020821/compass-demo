<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>商策罗盘 · 对话版</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#eef2f8;--card:#fff;--brand:#2f6bff;--brand-soft:#eaf1ff;
    --text:#1a2029;--dim:#8a93a3;--soft:#5a6472;--line:#eef0f4;
    --gold:#c6a76e;--green:#12b886;--red:#f0563f;--user:#dbe6ff;
  }
  body{background:#c9d3e2;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;justify-content:center;align-items:flex-start;padding:24px 12px;min-height:100vh}
  /* 手机外框 */
  .phone{width:390px;background:var(--bg);border-radius:44px;overflow:hidden;
    box-shadow:0 30px 80px rgba(20,40,80,.35);border:10px solid #0d1117;position:relative}
  .statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;
    padding:0 26px;font-size:14px;font-weight:600;color:var(--text);background:var(--bg)}
  .statusbar .right{display:flex;gap:5px;align-items:center;font-size:12px}
  /* 顶栏 */
  .nav{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 12px;background:var(--bg)}
  .nav .tabs{display:flex;gap:22px;font-size:17px;color:var(--dim);font-weight:500}
  .nav .tabs .on{color:var(--text);font-weight:700;background:#fff;padding:5px 16px;border-radius:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .nav .badge{font-size:9px;background:#fff;color:var(--brand);border:1px solid var(--brand);
    border-radius:5px;padding:1px 4px;position:relative}
  .nav .badge::after{content:"";position:absolute;top:-3px;right:-3px;width:6px;height:6px;background:var(--red);border-radius:50%}
  .nav .ic{color:var(--dim);font-size:18px}
  /* 聊天区 */
  .chat{height:660px;overflow-y:auto;padding:10px 16px 20px;scroll-behavior:smooth}
  .chat::-webkit-scrollbar{width:0}
  .daytag{text-align:center;margin:6px 0 16px}
  .daytag span{background:#dfe4ec;color:#97a0af;font-size:12px;padding:3px 12px;border-radius:12px}
  /* 消息行 */
  .row{display:flex;gap:8px;margin-bottom:14px;align-items:flex-start;opacity:0;transform:translateY(8px);
    animation:fadein .4s ease forwards}
  @keyframes fadein{to{opacity:1;transform:none}}
  .av{width:38px;height:38px;border-radius:12px;flex-shrink:0;object-fit:cover;
    background:linear-gradient(135deg,#7aa0ff,#4f7bff);display:flex;align-items:center;justify-content:center;
    font-size:20px}
  .bubble{max-width:80%;background:var(--card);border-radius:4px 16px 16px 16px;padding:13px 15px;
    font-size:15px;line-height:1.6;color:var(--text);box-shadow:0 2px 10px rgba(30,50,90,.05)}
  .bubble b{color:var(--brand)}
  .bubble .hl{color:var(--red);font-weight:700}
  .bubble .gl{color:var(--green);font-weight:700}
  .row.me{flex-direction:row-reverse}
  .row.me .bubble{background:var(--user);border-radius:16px 4px 16px 16px;color:#1a2c4d}
  .row.me .av{background:linear-gradient(135deg,#ffd27a,#f0a93f);font-size:18px}
  /* 卡片（AI 回答里嵌的结构化块） */
  .rcard{max-width:86%;background:var(--card);border-radius:16px;padding:16px;margin:-4px 0 14px 46px;
    box-shadow:0 3px 14px rgba(30,50,90,.06);opacity:0;transform:translateY(8px);animation:fadein .4s ease forwards}
  .rcard .ct{font-size:15px;font-weight:700;color:var(--text);margin-bottom:12px;
    padding-left:9px;border-left:3px solid var(--brand)}
  /* KPI 行 */
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .kbox{background:#f6f8fc;border-radius:10px;padding:10px 12px}
  .kbox .kv{font-size:19px;font-weight:800;color:var(--text)}
  .kbox .kv.g{color:var(--green)}.kbox .kv.r{color:var(--red)}
  .kbox .kl{font-size:11px;color:var(--dim);margin-top:2px}
  .ftip{background:#fff8ec;border:1px solid #f5e4c3;border-radius:10px;padding:11px 13px;margin-top:11px;
    font-size:13px;line-height:1.6;color:#7a5a1f}
  .ftip b{color:#b5831f}
  /* 趋势柱 */
  .trend{display:flex;align-items:flex-end;gap:2px;height:90px;margin:6px 0 4px}
  .trend i{flex:1;background:linear-gradient(180deg,#a9c3ff,#dfe9ff);border-radius:2px 2px 0 0}
  .trend i.hot{background:linear-gradient(180deg,#2f6bff,#7aa0ff)}
  .tlabel{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:4px}
  /* 明细列表 */
  .litem{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .litem:last-child{border:none}
  .litem .ln{font-size:14px;color:var(--text)}
  .litem .ls{font-size:11px;color:var(--dim);margin-top:2px}
  .litem .lv{font-size:15px;font-weight:700}
  .litem .lv.r{color:var(--red)}
  /* 对标条 */
  .vs{margin:10px 0}
  .vs .vh{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
  .vs .vh b{color:var(--text)}
  .vs .track{height:7px;background:#eef0f4;border-radius:4px;position:relative;overflow:visible}
  .vs .track .fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#2f6bff,#7aa0ff)}
  .vs .track .fill.bad{background:linear-gradient(90deg,#f0563f,#ff8a72)}
  .vs .track .peer{position:absolute;top:-3px;width:2px;height:13px;background:#333;border-radius:2px}
  .vs .vn{font-size:11px;color:var(--dim);margin-top:3px}
  /* 标签 */
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
  .tags span{font-size:12px;background:var(--brand-soft);color:var(--brand);padding:3px 10px;border-radius:14px}
  .ind{background:#f6f8fc;border-radius:10px;padding:11px 13px;margin-top:8px}
  .ind .ih{font-size:13px;font-weight:700;color:var(--text);margin-bottom:4px}
  .ind .ib{font-size:12.5px;color:var(--soft);line-height:1.55}
  .ind .ib b{color:var(--brand)}
  .ind .ia{font-size:12px;color:var(--green);font-weight:600;margin-top:5px}
  /* 推荐问题气泡 */
  .sugs{display:flex;flex-direction:column;gap:9px;margin:4px 0 14px 46px}
  .sug{background:#fff;border:1px solid #e3e9f2;border-radius:22px;padding:11px 16px;font-size:14px;
    color:var(--text);cursor:pointer;transition:.15s;display:flex;align-items:center;gap:8px;width:fit-content;max-width:88%}
  .sug:hover{border-color:var(--brand);color:var(--brand);transform:translateX(2px)}
  .sug .si{font-size:16px}
  /* 分析中 */
  .thinking{display:flex;flex-direction:column;gap:7px;font-size:14px;color:var(--soft)}
  .thinking .tl{display:flex;align-items:center;gap:8px}
  .thinking .tl .dot{width:14px;height:14px;border:2px solid var(--brand);border-radius:50%;
    border-top-color:transparent;animation:spin .8s linear infinite}
  .thinking .tl.done .dot{border:none;color:var(--brand)}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* 输入栏 */
  .inputbar{display:flex;align-items:center;gap:10px;padding:12px 16px 16px;background:var(--bg);border-top:1px solid #e3e8f0}
  .inputbar .plus{width:34px;height:34px;font-size:24px;color:var(--dim);display:flex;align-items:center;justify-content:center}
  .inputbar .box{flex:1;background:#fff;border-radius:22px;padding:11px 18px;font-size:14px;color:var(--dim);
    box-shadow:0 2px 8px rgba(0,0,0,.04)}
  .inputbar .mic{width:38px;height:38px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;
    font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
  .aigen{text-align:center;font-size:11px;color:#b3bcc9;padding:4px 0 8px;background:var(--bg)}
  .reset{position:absolute;top:52px;right:16px;z-index:9;background:var(--brand);color:#fff;border:none;
    padding:6px 12px;border-radius:14px;font-size:12px;cursor:pointer;box-shadow:0 3px 10px rgba(47,107,255,.3)}
</style>
</head>
<body>
<div class="phone">
  <button class="reset" onclick="location.reload()">↺ 重播</button>
  <div class="statusbar"><span>11:04</span><span class="right">📶 5G 🔋76</span></div>
  <div class="nav">
    <div style="display:flex;align-items:center;gap:8px"><span class="badge">内测中</span><span class="ic">☰</span></div>
    <div class="tabs"><span class="on">罗盘</span></div>
    <div style="display:flex;gap:12px"><span class="ic">🔊</span><span class="ic">✕</span></div>
  </div>

  <div class="chat" id="chat">
    <div class="daytag"><span>今天 11:04</span></div>
  </div>

  <div class="inputbar">
    <span class="plus">＋</span>
    <div class="box">问问你的生意…</div>
    <span class="mic">🎙️</span>
  </div>
  <div class="aigen">内容由 AI 生成 · 数据来自京东支付真实交易</div>
</div>

<script>
const chat=document.getElementById('chat');
const AV='<div class="av">🧭</div>';
const ME='<div class="av" style="background:linear-gradient(135deg,#ffd27a,#f0a93f)">🏪</div>';
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function scroll(){chat.scrollTop=chat.scrollHeight;}
function add(html){const d=document.createElement('div');d.innerHTML=html;chat.appendChild(d.firstElementChild);scroll();}

function aiBubble(text){add(`<div class="row">${AV}<div class="bubble">${text}</div></div>`);}
function meBubble(text){add(`<div class="row me">${ME}<div class="bubble">${text}</div></div>`);}
function card(title,body){add(`<div class="rcard"><div class="ct">${title}</div>${body}</div>`);}

// 分析中动画
async function thinking(steps){
  const id='th'+Math.random().toString(36).slice(2);
  add(`<div class="row" id="${id}">${AV}<div class="bubble"><div class="thinking">${
    steps.map(s=>`<div class="tl"><span class="dot"></span>${s}</div>`).join('')}</div></div></div>`);
  const rows=[...document.querySelectorAll('#'+id+' .tl')];
  for(let i=0;i<rows.length;i++){await wait(650);rows[i].classList.add('done');rows[i].querySelector('.dot').textContent='✓';}
  await wait(400);
  document.getElementById(id).remove();
}

function sugs(list){
  const html=list.map(s=>`<div class="sug" data-q="${s.q}" data-fn="${s.fn}"><span class="si">${s.i}</span>${s.q}</div>`).join('');
  add(`<div class="sugs" id="curSugs">${html}</div>`);
  document.querySelectorAll('#curSugs .sug').forEach(el=>{
    el.addEventListener('click',()=>{
      const q=el.dataset.q,fn=el.dataset.fn;
      document.getElementById('curSugs').remove();
      window[fn](q);
    });
  });
}

// ============ 各轮回答 ============

// 开场
async function boot(){
  await wait(300);
  aiBubble('老板好呀 👋 我是<b>商策罗盘</b>，你的经营小助手。我连着京东支付的真实交易和结算数据，账算得清、客看得透、同行也帮你盯着——想先看点啥？');
  await wait(500);
  sugs([
    {i:'💰',q:'这个月我到底赚了多少？',fn:'ansMoney'},
    {i:'📈',q:'我的生意最近有什么变化？',fn:'ansTrend'},
    {i:'👥',q:'买我童装的都是些什么人？',fn:'ansPersona'},
    {i:'📊',q:'我在同行里算好还是差？',fn:'ansPeer'},
    {i:'🔁',q:'我的复购和高价值客户情况？',fn:'ansRepeat'},
  ]);
}

// 1 赚了多少
async function ansMoney(q){
  meBubble(q);
  await wait(400);
  await thinking(['读取结算全链路数据','拆解货款/佣金/服务费/退款','核算真实到手']);
  aiBubble('帮你算清楚啦～这个月账面货款 GMV <b>59.0 万</b>，但别只看流水。扣掉佣金 3.1 万、商品险+运费险 1.7 万等服务费，再减去退款冲正 3.5 万，<b>真实到手其实是 <span class="gl">50.4 万</span></b>，真实利润率 85.4%。');
  card('💰 真账体检（本月）',`
    <div class="kpis">
      <div class="kbox"><div class="kv">¥59.0万</div><div class="kl">账面货款 GMV</div></div>
      <div class="kbox"><div class="kv r">-¥5.1万</div><div class="kl">佣金+各项服务费</div></div>
      <div class="kbox"><div class="kv r">-¥3.5万</div><div class="kl">退款冲正</div></div>
      <div class="kbox"><div class="kv g">¥50.4万</div><div class="kl">真实到手</div></div>
    </div>
    <div class="ftip">💡 <b>退款 3.5 万</b>是你最大的可控漏洞——集中在几款高退货商品上，想看是哪几款吗？</div>`);
  await wait(500);
  sugs([
    {i:'📦',q:'哪些商品退款最多？',fn:'ansSku'},
    {i:'💰',q:'我的钱多久能到账？',fn:'ansCashflow'},
    {i:'📈',q:'那我生意最近的走势呢？',fn:'ansTrend'},
    {i:'👥',q:'买我东西的是什么人？',fn:'ansPersona'},
  ]);
}

// 2 趋势
async function ansTrend(q){
  meBubble(q);
  await wait(400);
  await thinking(['拉取近30天每日订单','识别增长拐点']);
  aiBubble('有个好消息！<b>7月27日起你的订单量明显起飞了</b> 🚀 前10天日均才 756 单，7/27之后冲到日均 <b>1,216 单</b>，涨了 <span class="gl">61%</span>，7/29 当天最高 1,534 单。暑期/开学季的需求来了。');
  const data=[798,797,850,790,913,901,754,720,587,455,560,719,859,758,444,287,308,370,680,992,855,834,1147,1356,1454,1534,1388,1148,1122,949,778];
  const mx=Math.max(...data);
  const bars=data.map((v,i)=>`<i class="${i>=23?'hot':''}" style="height:${Math.round(v/mx*100)}%"></i>`).join('');
  card('📈 近30天订单趋势',`
    <div class="trend">${bars}</div>
    <div class="tlabel"><span>07-04</span><span style="color:var(--brand);font-weight:700">7/27 拐点↑</span><span>08-03</span></div>
    <div class="ftip">💡 增长窗口已打开，建议<b>立即补足 110-130 主力码库存</b>、加大爆款 IP 备货，别断货错过这波。</div>`);
  await wait(500);
  sugs([
    {i:'👥',q:'那这波买家都是些什么人？',fn:'ansPersona'},
    {i:'📊',q:'同行也在涨吗？我排第几？',fn:'ansPeer'},
  ]);
}

// 3 画像
async function ansPersona(q){
  meBubble(q);
  await wait(400);
  await thinking(['基于实名身份识别唯一真人','解析年龄/性别/地域','脱敏聚合群体特征']);
  aiBubble('这是零售后台给不了的角度——我能靠<b>实名身份</b>还原买家画像。你的核心客群是 <b>31-38 岁、江浙沪、女性家长</b>，而且消费力不弱，<b>信用类支付（白条+信用卡）占比过半</b>。');
  card('👥 谁在买你的童装',`
    <div class="kpis">
      <div class="kbox"><div class="kv">31-38岁</div><div class="kl">主力家长年龄</div></div>
      <div class="kbox"><div class="kv">68%</div><div class="kl">女性家长</div></div>
      <div class="kbox"><div class="kv">江浙沪</div><div class="kl">地域 TOP</div></div>
      <div class="kbox"><div class="kv">¥2760</div><div class="kl">买家人均全站消费</div></div>
    </div>
    <div class="ftip">💡 年龄由<b>真实购买尺码反推</b>（110-130码占54%→孩子3-6岁→家长31-38岁）；买家<b>人均在京东全站消费 2760 元</b>，是有稳定消费力的中产家庭。</div>`);
  await wait(500);
  sugs([
    {i:'🔁',q:'那我的复购和高价值客户呢？',fn:'ansRepeat'},
    {i:'📊',q:'这客群比同行好吗？',fn:'ansPeer'},
  ]);
}

// 4 同行对标（总览，引出逐维度深挖）
async function ansPeer(q){
  meBubble(q);
  await wait(400);
  await thinking(['按类目/价格带/区域匹配同行','脱敏计算行业基准','生成对标总览']);
  aiBubble('我拿你和<b>同主营类目（母婴服饰）</b>的商户做了全面对标。先给你一句话结论：<b class="gl">客群质量强、但价格没卖上去</b>——你的客更年轻、消费力更强，客单价却只有行业一半。想从哪个维度看细节？咱们一个个拆。');
  card('📊 同行对标 · 总览',`
    <div style="background:#f6f8fc;border-radius:10px;padding:12px 13px;margin-bottom:10px">
      <div style="font-size:14px;font-weight:700;color:var(--text);margin-bottom:8px">👥 客群画像对比</div>
      <div style="display:flex;gap:10px">
        <div style="flex:1"><div style="font-size:11px;color:var(--dim);margin-bottom:3px">你的客群</div>
          <div style="font-size:12.5px;line-height:1.6;color:var(--brand);font-weight:600">江浙沪 · 31-38岁<br>女性家长 · 高购买力</div></div>
        <div style="width:1px;background:var(--line)"></div>
        <div style="flex:1"><div style="font-size:11px;color:var(--dim);margin-bottom:3px">行业平均</div>
          <div style="font-size:12.5px;line-height:1.6;color:var(--soft)">全国分散 · 35-40岁<br>家长 · 中等购买力</div></div>
      </div>
    </div>
    <div class="litem"><div><div class="ln">💰 价格带</div><div class="ls">客单¥63，行业中位¥122</div></div><div class="lv" style="color:var(--gold)">偏低 －</div></div>
    <div class="litem"><div><div class="ln">💳 客群消费力</div><div class="ls">白条34%、人均全站2760元</div></div><div class="lv gl">领先 ▲</div></div>
    <div class="litem"><div><div class="ln">💰 回款速度</div><div class="ls">T+3.9天，快于同行</div></div><div class="lv gl">领先 ▲</div></div>
    <div class="litem"><div><div class="ln">🔥 爆款/趋势</div><div class="ls">部分品类缺位</div></div><div class="lv" style="color:var(--gold)">有缺口 －</div></div>
    <div class="litem"><div><div class="ln">🗺️ 区域覆盖</div><div class="ls">中西部不足</div></div><div class="lv" style="color:var(--gold)">有机会 －</div></div>
    <div class="litem"><div><div class="ln">📈 利润率</div><div class="ls">85.4%，优于同行</div></div><div class="lv gl">领先 ▲</div></div>`);
  await wait(500);
  aiBubble('先看哪个？我建议从<b>客群画像对比</b>开始，因为它决定了你后面所有的定价和选品策略。');
  sugs([
    {i:'👥',q:'先看客群画像对比',fn:'peerPersona'},
    {i:'↩️',q:'我的退款率为啥落后？',fn:'peerRefund'},
    {i:'💰',q:'我的价格带偏低吗？',fn:'peerPrice'},
  ]);
}

// 同行对标 · 客群画像对比
async function peerPersona(q){
  meBubble(q);
  await wait(400);
  await thinking(['对齐同行客群结构','逐指标计算差距']);
  aiBubble('你的客群<b>整体比同行更优质</b> 👍 消费力、城市层级都领先——这是你能走中高端、卖溢价的底气。');
  card('👥 客群画像 · 你 vs 同行',`
    <div class="vs"><div class="vh"><b>信用类支付占比（消费力）</b><span class="gl">53% ▲ 高</span></div>
      <div class="track"><div class="fill" style="width:53%"></div><div class="peer" style="left:40%"></div></div>
      <div class="vn">白条34%+信用卡19%，同行约40%</div></div>
    <div class="vs"><div class="vh"><b>买家人均全站消费</b><span class="gl">¥2760 ▲</span></div>
